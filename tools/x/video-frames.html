<!doctype html><meta charset="utf-8"><title>video-frames</title>
<!-- 🎞️ CHỤP KHUNG VIDEO MẪU THEO ĐÚNG FPS (Windows, không ffmpeg): PHÁT video chậm (không tua — tua trong trình duyệt ngầm hay trả khung cũ) và chụp mỗi khung trình chiếu.
     tools/x/video-frames.html?src=tools/x/_ref/uno1.mp4&a=33&b=37&fps=30&w=96&cols=30   → window.__png (lưới: mỗi hàng = 1 giây nếu cols=fps), window.__done -->
<canvas id="c"></canvas><video id="v" muted playsinline></video><script>
(async()=>{ const q=new URLSearchParams(location.search), v=document.getElementById('v'), A=+q.get('a'), B=+q.get('b'), FPS=+(q.get('fps')||30), W=+(q.get('w')||96), cols=+(q.get('cols')||FPS);
 v.src='/'+q.get('src'); v.muted=true; await new Promise((r,j)=>{ v.onloadedmetadata=r; v.onerror=()=>j(new Error('không mở được video')); });
 const N=Math.round((B-A)*FPS), H=Math.round(W*v.videoHeight/v.videoWidth), c=document.getElementById('c'); c.width=cols*W; c.height=Math.ceil(N/cols)*(H+12); const g=c.getContext('2d'); g.fillStyle='#111'; g.fillRect(0,0,c.width,c.height);
 v.currentTime=Math.max(0,A-0.6); await new Promise(r=>v.onseeked=r); v.playbackRate=+(q.get('rate')||0.2); await v.play(); let i=0;
 await new Promise(res=>{ const grab=()=>{ while(i<N&&v.currentTime>=A+i/FPS){ const x=(i%cols)*W, y=Math.floor(i/cols)*(H+12); g.drawImage(v,x,y+12,W,H); if(i%5===0){ g.fillStyle='#ff0'; g.font='bold 10px monospace'; g.fillText((A+i/FPS).toFixed(2),x+2,y+10); } i++; } if(i>=N||v.ended) res(); else (v.requestVideoFrameCallback?v.requestVideoFrameCallback(grab):requestAnimationFrame(grab)); }; grab(); });
 v.pause(); window.__png=c.toDataURL('image/png'); window.__done='OK '+i+'/'+N; })().catch(e=>window.__done='LỖI '+e.message);
</script>
